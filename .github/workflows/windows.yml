name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and package
        shell: powershell
        run: .\build.ps1 -Package
      - name: Privacy and retention fixtures
        shell: powershell
        run: .\tests\PrivacyRetention.ps1
      - name: Isolated runtime smoke test
        shell: powershell
        run: .\tests\Smoke.ps1
      - name: Storage failure and recovery
        shell: powershell
        run: .\tests\Health.ps1
